name: Bug Report
description: Report a bug or unintended behavior in AutoCrop
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with AutoCrop!
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      description: Which Minecraft version are you playing? (e.g., 26.3, 26.2, 1.21.1)
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      description: Which version of AutoCrop is installed? (e.g., 1.4)
    validations:
      required: true
  - type: input
    id: loader_version
    attributes:
      label: Fabric Loader Version
      description: Which Fabric Loader version are you using?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed summary of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this bug?
      placeholder: |
        1. Plant wheat
        2. Set mode to MANUAL
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report
      description: Paste any crash reports or console logs here.
      render: text
