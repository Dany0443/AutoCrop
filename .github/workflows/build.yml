name: build

on:
  push:
    branches: [main, '26.1', '26.2', '26.3', '1.21.11']
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated Minecraft versions (26.1,26.2,26.3,1.21.11), or all'
        type: string
        required: true
        default: '26.1,26.2,26.3,1.21.11'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select changed Minecraft targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test version selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select versions
        id: targets
        run: python3 .github/scripts/select_build_targets.py
      - name: Pin each selected version branch
        id: sources
        if: steps.targets.outputs.has_targets == 'true'
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: python3 .github/scripts/branch_sources.py

  compile:
    needs: select
    if: needs.select.outputs.has_targets == 'true'
    uses: ./.github/workflows/compile.yml
    with:
      sources: ${{ needs.select.outputs.sources }}

  result:
    name: Build result
    if: always()
    needs: [select, compile]
    runs-on: ubuntu-24.04
    steps:
      - name: Check selected builds
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$COMPILE_RESULT" = success || test "$COMPILE_RESULT" = skipped
