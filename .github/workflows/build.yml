name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: Minecraft versions to compile from the selected branch
        type: choice
        required: true
        default: both
        options: [both, '26.2', '26.3']

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select changed Minecraft targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test version selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select versions
        id: targets
        run: python3 .github/scripts/select_build_targets.py

  compile:
    needs: select
    if: needs.select.outputs.has_targets == 'true'
    uses: ./.github/workflows/compile.yml
    with:
      targets: ${{ needs.select.outputs.targets }}

  result:
    name: Build result
    if: always()
    needs: [select, compile]
    runs-on: ubuntu-24.04
    steps:
      - name: Check selected builds
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$COMPILE_RESULT" = success || test "$COMPILE_RESULT" = skipped
