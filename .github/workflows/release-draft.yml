name: release-draft

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build (for example v1.5.0)
        required: true
        type: string
      versions:
        description: Minecraft versions to include
        type: choice
        default: both
        options: [both, '26.2', '26.3']

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      targets: ${{ steps.source.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact release source
        id: source
        env:
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
          VERSIONS: ${{ github.event.inputs.versions || 'both' }}
        run: |
          COMMIT=$(git rev-parse --verify --end-of-options "refs/tags/${TAG}^{commit}")
          MOD_VERSION=$(git show "${COMMIT}:gradle.properties" | sed -n 's/^mod_version=//p')
          if [ "${TAG#v}" != "$MOD_VERSION" ]; then
            echo "Release tag must match mod_version ($MOD_VERSION) in the tagged commit."
            exit 1
          fi
          case "$VERSIONS" in
            both) TARGETS='["26.2","26.3"]' ;;
            26.2) TARGETS='["26.2"]' ;;
            26.3) TARGETS='["26.3"]' ;;
            *) exit 1 ;;
          esac
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  compile:
    needs: source
    uses: ./.github/workflows/compile.yml
    with:
      targets: ${{ needs.source.outputs.targets }}
      ref: ${{ needs.source.outputs.commit }}

  draft-release:
    needs: [source, compile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release_artifacts
          pattern: autocrop-mc*
          merge-multiple: true
      - name: Record checksums and source
        working-directory: release_artifacts
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          sha256sum ./*.jar > SHA256SUMS.txt
          echo "$SOURCE_COMMIT" > SOURCE_COMMIT.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.source.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" release_artifacts/* \
            --verify-tag --draft \
            --title "AutoCrop $TAG_NAME" --generate-notes
