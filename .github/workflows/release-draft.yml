name: release-draft

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version/tag (for example v1.5.0); blank uses mod_version'
        required: false
        type: string
      versions:
        description: 'Comma-separated Minecraft versions, or all'
        type: string
        required: true
        default: '26.1,26.2,26.3,1.21.11'
      previous_release:
        description: 'Optional changelog baseline tag; blank finds the previous published release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      targets: ${{ steps.source.outputs.targets }}
      sources: ${{ steps.source.outputs.sources }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test version selection and release notes
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Resolve exact release source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          VERSIONS: ${{ inputs.versions || 'all' }}
          PREVIOUS_RELEASE: ${{ inputs.previous_release }}
        run: python3 .github/scripts/release_tools.py prepare

  compile:
    needs: source
    uses: ./.github/workflows/compile.yml
    with:
      sources: ${{ needs.source.outputs.sources }}
      mod_version: ${{ needs.source.outputs.version }}

  draft-release:
    needs: [source, compile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout workflow helpers
        uses: actions/checkout@v7.0.1
        with:
          path: .workflow
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release_artifacts
          pattern: autocrop-mc*
          merge-multiple: true
      - name: Record jar checksums
        working-directory: release_artifacts
        run: |
          sha256sum ./*.jar > SHA256SUMS.txt
      - name: Create or update draft with all commits since previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          TARGETS: ${{ needs.source.outputs.targets }}
          VERSION_SOURCES: ${{ needs.source.outputs.sources }}
          PREVIOUS_RELEASE: ${{ inputs.previous_release }}
        run: python3 .workflow/.github/scripts/release_tools.py draft
