version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// java 25 configuration
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

// repositories
repositories {
    maven {
        name = "FabricMC"
        url  = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Shedaniel (Cloth Config)"
        url  = "https://maven.shedaniel.me/"
    }
    maven {
        name = "TerraformersMC (ModMenu)"
        url  = "https://maven.terraformersmc.com/releases/"
    }
    mavenCentral()
}

// dependencies
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

sourceSets {
    main {
        java {
            srcDirs = ["../../src/main/java"]
        }
        resources {
            srcDirs = ["../../src/main/resources"]
        }
    }
}

processResources {
    inputs.property("mod_version", project.mod_version)
    inputs.property("minecraft_version", project.minecraft_version)
    inputs.property("loader_version", project.loader_version)

    filesMatching("fabric.mod.json") {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_version: project.loader_version
        )
    }
}

loom {
    accessWidenerPath = file("../../src/main/resources/autocrop.accesswidener")
}

jar {
    from("../../LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
